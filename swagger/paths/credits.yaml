/v1/credits/balance:
  get:
    summary: Get credits balance
    tags: [Credits]
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Current credits balance
        content:
          application/json:
            schema:
              $ref: '../schemas/credits.yaml#/components/schemas/CreditsBalanceResponse'

/v1/credits/transactions:
  get:
    summary: Get transaction history
    tags: [Credits]
    security:
      - bearerAuth: []
    parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
    responses:
      '200':
        description: Transaction history
        content:
          application/json:
            schema:
              $ref: '../schemas/credits.yaml#/components/schemas/TransactionHistoryResponse'

/v1/credits/purchase:
  post:
    summary: Process IAP purchase
    description: Verify StoreKit 2 transaction and add credits
    tags: [Credits]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/credits.yaml#/components/schemas/PurchaseRequest'
    responses:
      '200':
        description: Purchase processed
        content:
          application/json:
            schema:
              $ref: '../schemas/credits.yaml#/components/schemas/PurchaseResponse'

/v1/credits/reward:
  post:
    summary: Add reward credit from ads
    tags: [Credits]
    security:
      - bearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../schemas/credits.yaml#/components/schemas/RewardRequest'
    responses:
      '200':
        description: Reward credit added
        content:
          application/json:
            schema:
              $ref: '../schemas/credits.yaml#/components/schemas/RewardResponse'
