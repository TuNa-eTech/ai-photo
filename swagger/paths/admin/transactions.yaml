/v1/admin/transactions:
  get:
    summary: Get all transaction history (admin)
    description: Get all transactions across all users with user information. Admin endpoint for web-cms.
    tags: [Admin - Credits]
    security:
      - bearerAuth: []
    parameters:
      - name: limit
        in: query
        description: Maximum number of transactions to return
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        description: Number of transactions to skip for pagination
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: userId
        in: query
        description: Filter by specific user ID
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        description: Filter by transaction type
        schema:
          type: string
          enum: [purchase, usage, bonus]
    responses:
      '200':
        description: Transaction history with user information
        content:
          application/json:
            schema:
              $ref: '../schemas/credits.yaml#/components/schemas/AdminTransactionHistoryResponse'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - Admin access required
