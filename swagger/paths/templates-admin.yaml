/v1/admin/templates:
  get:
    summary: List all templates (Admin)
    description: Get all templates with full details including prompts
    tags: [Admin - Templates]
    security:
      - bearerAuth: []
    parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          enum: [draft, published, archived]
      - name: visibility
        in: query
        schema:
          enum: [public, private]
      - name: trending
        in: query
        schema:
          type: boolean
      - name: sort
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
      - name: offset
        in: query
        schema:
          type: integer
    responses:
      '200':
        description: Templates list with full details
  
  post:
    summary: Create template
    tags: [Admin - Templates]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/templates.yaml#/components/schemas/CreateTemplateDto'
    responses:
      '201':
        description: Template created

/v1/admin/templates/{slug}:
  get:
    summary: Get template by slug
    tags: [Admin - Templates]
    security:
      - bearerAuth: []
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Template details
  
  put:
    summary: Update template
    tags: [Admin - Templates]
    security:
      - bearerAuth: []
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../schemas/templates.yaml#/components/schemas/UpdateTemplateDto'
    responses:
      '200':
        description: Template updated
  
  delete:
    summary: Delete template
    tags: [Admin - Templates]
    security:
      - bearerAuth: []
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    responses:
      '204':
        description: Template deleted

/v1/admin/templates/{slug}/publish:
  post:
    summary: Publish template
    description: Mark template as published (requires thumbnail)
    tags: [Admin - Templates]
    security:
      - bearerAuth: []
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Template published
      '422':
        description: Cannot publish (missing thumbnail)

/v1/admin/templates/{slug}/unpublish:
  post:
    summary: Unpublish template
    tags: [Admin - Templates]
    security:
      - bearerAuth: []
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Template unpublished

/v1/admin/templates/{slug}/trending:
  post:
    summary: Mark as trending
    tags: [Admin - Templates]
    security:
      - bearerAuth: []
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Marked as trending
  
  delete:
    summary: Unmark trending
    tags: [Admin - Templates]
    security:
      - bearerAuth: []
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Removed from trending

/v1/admin/templates/{slug}/assets:
  post:
    summary: Upload template asset
    description: Upload thumbnail, preview, cover, or sample image
    tags: [Admin - Templates]
    security:
      - bearerAuth: []
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    requestBody:
      content:
        multipart/form-data:
          schema:
            type: object
            required: [kind, file]
            properties:
              kind:
                type: string
                enum: [thumbnail, preview, cover, sample]
              file:
                type: string
                format: binary
    responses:
      '200':
        description: Asset uploaded
