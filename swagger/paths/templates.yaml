/v1/templates:
  get:
    summary: List templates (Public)
    description: Get list of published public templates with pagination and filtering
    tags: [Templates]
    security:
      - bearerAuth: []
    parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: q
        in: query
        schema:
          type: string
        description: Search by name or slug
      - name: tags
        in: query
        schema:
          type: string
        description: Filter by tags (comma-separated)
      - name: category
        in: query
        schema:
          type: string
        description: Filter by category slug
      - name: sort
        in: query
        schema:
          type: string
          enum: [newest, popular, name]
          default: newest
    responses:
      '200':
        description: Templates list
        content:
          application/json:
            schema:
              $ref: '../schemas/templates.yaml#/components/schemas/TemplatesListResponse'

/v1/templates/trending:
  get:
    summary: Get trending templates
    description: Get manually flagged or high-usage trending templates
    tags: [Templates]
    security:
      - bearerAuth: []
    parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
    responses:
      '200':
        description: Trending templates

/v1/templates/categories:
  get:
    summary: Get templates grouped by categories
    description: Get all templates organized by categories
    tags: [Templates]
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Templates by category
